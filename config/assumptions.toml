# Defaults used by `lacounty-tax analyze`. Copy, edit, and pass with --config.
# These are placeholders to tune, not facts. All rates are fractions (0.06 = 6%).
bid_multiple = 1.0          # expected winning bid / minimum bid (1.0 = you win at the floor)
closing_cost_pct = 0.03     # fees, recording, etc. on top of the bid
vacancy_rate = 0.06
opex_pct = 0.25             # insurance, maintenance, management as % of collected rent
property_tax_rate = 0.0125  # on purchase price (Prop 13 resets to price)
target_cap_rate = 0.08
rent_factor = 1.0           # scale HUD FMR (HUD FMR is ~40th percentile rent)
rehab_min = 10000
rehab_per_sqft_new = 15     # built 1980 or later
rehab_per_sqft_mid = 30     # 1950-1979
rehab_per_sqft_old = 45     # before 1950
recent_transfer_years = 3
equity_ratio_flag = 10      # assessed value / min bid treated as "lots of owner equity"
paid_down_threshold = 0.5   # share of the book's minimum bid already paid off that marks an account "paid down"
paid_down_leave_prob = 0.75 # chance a paid-down account is pulled before the sale (assumption, not measured)
rank_by = "adjusted"        # "adjusted" = cap rate x odds of staying in the sale; "cap" = raw cap rate
