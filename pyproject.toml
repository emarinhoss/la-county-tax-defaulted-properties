[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacounty-tax"
version = "0.1.0"
description = "Collect, enrich and analyze LA County tax-defaulted property auctions."
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "pandas>=2.0", "requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "shapely>=2.0"]
geo = ["shapely>=2.0"]

[project.scripts]
lacounty-tax = "lacounty_tax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
lacounty_tax = ["templates/*"]
