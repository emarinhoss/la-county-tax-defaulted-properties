name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Dashboard builds from synthetic data
        run: |
          lacounty-tax make-demo --out "$RUNNER_TEMP/demo"
          lacounty-tax build-site --data-dir "$RUNNER_TEMP/demo" --out "$RUNNER_TEMP/site"
