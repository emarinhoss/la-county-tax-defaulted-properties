name: Probe parcel layers

# Manual: checks which of the county's ArcGIS layers can turn parcel numbers (AINs) into
# coordinates, from GitHub's network, and writes the report to the run summary.
on:
  workflow_dispatch:
    inputs:
      auction:
        description: "Auction whose AINs form the test sample"
        default: "2026B"
        required: false
        type: string
      known_only:
        description: "Only the short list of known candidates (fast)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Probe
        env:
          AUCTION: ${{ inputs.auction }}
          KNOWN_ONLY: ${{ inputs.known_only }}
        run: |
          args=()
          if [ "$KNOWN_ONLY" = "true" ]; then args+=(--known-only); fi
          lacounty-tax probe-gis --auction "$AUCTION" --out probe-report.md --json probe-report.json "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: |
            probe-report.md
            probe-report.json
